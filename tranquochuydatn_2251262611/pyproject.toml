[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-level-prediction"
version = "0.1.0"
description = "Groundwater level forecasting experiments and demo API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "scikit-learn>=1.5,<2.0",
  "statsmodels>=0.14,<0.15",
  "torch>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "matplotlib>=3.9,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
